<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Expense Tracker - Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>💳 Expense Tracker</h1>
    <p class="subtitle">Log daily expenses, filter transactions, and export reports.</p>

    <!-- Stat Metrics -->
    <div class="dashboard-metrics">
      <div class="metric-card purple">
        <h3>Total Spent</h3>
        <div class="value">₹<span id="total-amount">0.00</span></div>
      </div>
      <div class="metric-card green">
        <h3>Average / Entry</h3>
        <div class="value">₹<span id="avg-expense">0.00</span></div>
      </div>
      <div class="metric-card amber">
        <h3>Highest Category</h3>
        <div class="value" id="highest-category">None</div>
      </div>
      <div class="metric-card pink">
        <h3>Budget Savings</h3>
        <div class="value">₹<span id="savings">2000.00</span></div>
      </div>
    </div>

    <!-- Input Form -->
    <form id="expense-form">
      <input type="text" id="expense-name" placeholder="Expense Title" required>
      <input type="number" id="expense-amount" placeholder="Amount (₹)" step="0.01" required>
      <select id="expense-category" required>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Bills">Bills</option>
        <option value="Shopping">Shopping</option>
        <option value="Others">Others</option>
      </select>
      <input type="date" id="expense-date" required>
      <button type="submit" class="action-btn btn-primary">➕ Add Expense</button>
    </form>

    <!-- Filters & Search Bar -->
    <div class="filters-bar">
      <input type="text" id="search-box" placeholder="🔍 Search records..." style="flex: 1;">
      <select id="filter-category">
        <option value="All">All Categories</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Bills">Bills</option>
        <option value="Shopping">Shopping</option>
        <option value="Others">Others</option>
      </select>
      <select id="time-filter">
        <option value="all">All Time</option>
        <option value="daily">Today</option>
        <option value="weekly">This Week</option>
        <option value="monthly">This Month</option>
      </select>
    </div>

    <!-- Expense Table -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Expense Name</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th style="text-align: center;">Actions</th>
          </tr>
        </thead>
        <tbody id="expense-list"></tbody>
      </table>
    </div>

    <!-- Page Actions -->
    <div style="text-align: center; margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: center;">
      <button class="action-btn" id="export-btn">📑 Export CSV</button>
      <button class="action-btn btn-primary" onclick="location.href='chart.html'">📊 View Charts</button>
      <button class="action-btn" onclick="location.href='index.html'">🏠 Home</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
