<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>💰 Smart Expense Tracker</h1>

    <!-- Add Expense Form -->
    <form id="expense-form">
      <input type="text" id="expense-name" placeholder="Expense Name" required>
      <input type="number" id="expense-amount" placeholder="Amount" step="0.01" required>
      <select id="expense-category" required>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Bills">Bills</option>
        <option value="Shopping">Shopping</option>
        <option value="Others">Others</option>
      </select>
      <input type="date" id="expense-date" required>
      <button type="submit">Add Expense</button>
    </form>

    <!-- Filters -->
    <div class="filters">
      <select id="filter-category">
        <option value="All">All Categories</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Bills">Bills</option>
        <option value="Shopping">Shopping</option>
        <option value="Others">Others</option>
      </select>
      <select id="time-filter">
        <option value="all">All Time</option>
        <option value="daily">Today</option>
        <option value="weekly">This Week</option>
        <option value="monthly">This Month</option>
      </select>
      <input type="text" id="search-box" placeholder="Search expenses...">
    </div>

    <!-- Expense Table -->
    <div class="expense-table">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expense-list"></tbody>
      </table>
    </div>

    <!-- Total & Actions -->
    <div class="total-amount">Total: $<span id="total-amount">0.00</span></div>
    <div style="text-align:center; margin-top:20px;">
      <button class="action-btn" id="export-btn">📑 Export to CSV</button>
      <button class="action-btn" onclick="location.href='chart.html'">📊 View Charts</button>
      <button class="action-btn" onclick="location.href='index.html'">🏠 Home</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
